<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="todo-container">
      <h1>My To-Do List</h1>
      <p class="subtitle">Organize your day and get things done</p>

      <!-- Add Task -->
      <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter a new task..." />
        <button id="addBtn">Add</button>
      </div>

      <!-- Task Counter -->
      <div class="stats">
        <span>Total: <b id="totalTasks">0</b></span>
        <span>Completed: <b id="completedTasks">0</b></span>
        <span>Pending: <b id="pendingTasks">0</b></span>
      </div>

      <!-- Task List -->
      <ul id="taskList"></ul>

      <!-- Empty Message -->
      <p id="emptyMessage">No tasks yet. Add your first task! 🎯</p>
    </div>

    <script src="./scrip.js"></script>
  </body>
</html>
